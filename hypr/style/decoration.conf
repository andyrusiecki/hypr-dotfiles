# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
  rounding = 0

  shadow {
    enabled = true
    range = 2
    render_power = 3
    color = rgba(1a1a1aee)
  }

  # https://wiki.hyprland.org/Configuring/Variables/#blur
  blur {
    enabled = true
    size = 3
    passes = 1

    vibrancy = 0.1696
  }
}
