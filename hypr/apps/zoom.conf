# Fix disappearing pop-ups in zoom
windowrule {
  name = zoom-suppress-focus
  match:class = zoom
  match:title = negative:(menu window|confirm window)

  suppressevent = activatefocus
}

windowrule {
  name = zoom-popups
  match:class = zoom
  match:title = (menu window|confirm window)

  stayfocused = on
}

# meeting reminders
windowrule {
  name = zoom-reminders
  match:class = zoom
  match:title = zoom_linux_float_message_reminder

  move = (monitor_w - window_w - 10) 55
  pin = on
  noborder = on
  noanim = on
  noblur = on
}

# other pop ups
windowrule {
  name = zoom-other
  match:class = zoom
  match:title = (Zoom Workplace)

  float = on
}
