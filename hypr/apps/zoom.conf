# Fix disappearing pop-ups in zoom
windowrule {
  name = zoom-suppress-focus
  match:class = zoom
  match:title = negative:(menu window|confirm window)

  suppress_event = activatefocus
}

windowrule {
  name = zoom-popups
  match:class = zoom
  match:title = menu window|confirm window

  stay_focused = on
}

# meeting overlays
windowrule {
  name = zoom-overlays
  match:class = zoom
  match:title = zoom

  suppress_event = activatefocus
}

# meeting reminders
windowrule {
  name = zoom-reminders
  match:class = zoom
  match:title = zoom_linux_float_message_reminder

  move = monitor_w-window_w-10 40
  pin = on
  border_size = 0
  no_anim = on
  no_blur = on
}

