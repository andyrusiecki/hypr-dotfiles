# Fix disappearing pop-ups in zoom
windowrule {
  name = zoom-popups
  match:class = zoom
  match:title = negative:(Meeting|Zoom Workplace - .*)
  # matching all other window titles: zoom|menu window|confirm window|Toolbar Menu|zoom_linux_float_message_reminder|Transcription is .*

  no_initial_focus = on
}

# meeting reminders
windowrule {
  name = zoom-reminders
  match:class = zoom
  match:title = zoom_linux_float_message_reminder

  move = monitor_w-window_w-10 40
  pin = on
}

