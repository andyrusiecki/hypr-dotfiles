source = ~/.cache/wal/colors-hyprland-extra.conf

# Browser PiP video
windowrule {
  name = pip-browser
  match:title = (Picture.?in.?[Pp]icture)

  tag = +pip
}

# Spotify mini player
windowrule {
  name = pip-spotify
  match:class = ([Cc]hromium-browser)
  match:title = (.* • .*)
  match:float = 1

  tag = +pip
}

# Picture-in-Picture windows
windowrule {
  name = pip-windows
  match:tag = pip

  float = on
  pin = on
  size = 600 338
  keepaspectratio = on
  bordercolor = $color2hex $color2hex
  opacity = 1 1
  move = (monitor_w - window_w - 10) 55
}
