source = ~/.cache/wal/colors-hyprland-extra.conf

# Browser PiP video
windowrulev2 = tag +pip, title:(Picture.?in.?[Pp]icture)

# Spotify mini player
windowrulev2 = tag +pip, class:([Cc]hromium-browser), title:(.* • .*), floating:1

# Picture-in-Picture windows
windowrulev2 = float, tag:pip
windowrulev2 = pin, tag:pip
windowrulev2 = size 600 338, tag:pip
windowrulev2 = keepaspectratio, tag:pip
#windowrulev2 = noborder, tag:pip
windowrulev2 = bordercolor $color2hex $color2hex, tag:pip
windowrulev2 = opacity 1 1, tag:pip
windowrulev2 = move onscreen 100%-w-10 55, tag:pip
