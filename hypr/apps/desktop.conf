# TUI pop-ups
windowrulev2 = tag +tui-popup, class:(TUI.float)

windowrulev2 = float, tag:tui-popup
windowrulev2 = center, tag:tui-popup
windowrulev2 = size 75% 75%, tag:tui-popup
windowrulev2 = dimaround on, tag:tui-popup

# Floating windows
windowrulev2 = float, tag:floating-window
windowrulev2 = center, tag:floating-window
windowrulev2 = size 800 600, tag:floating-window

windowrulev2 = tag +floating-window, class:(org.gnome.NautilusPreviewer)
windowrulev2 = tag +floating-window, class:(xdg-desktop-portal-gtk|org.gnome.Nautilus), title:^(Open.*Files?|Open Folder|Save.*Files?|Save.*As|Save|All Files)

# No transparency on media windows
windowrulev2 = opacity 1 1, class:^(zoom|vlc|mpv|org.kde.kdenlive|com.obsproject.Studio|com.github.PintaProject.Pinta|imv|org.gnome.NautilusPreviewer)$
