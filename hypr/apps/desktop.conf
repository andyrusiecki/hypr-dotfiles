# TUI pop-ups
windowrule {
  name = tui-popups
  match:class = TUI.float

  float = on
  center = on
  size = (monitor_w*0.75) (monitor_h*0.75)
}

windowrule {
  name = tui-popups-floating
  match:class = TUI.float
  match:float = true

  dim_around = on
}

# Floating windows
windowrule {
  name = floating-windows
  match:tag = floating-window

  float = on
  center = on
  size = 800 600
}

windowrule {
  name = floating-windows-nautilus-previewer
  match:class = org.gnome.NautilusPreviewer

  tag = +floating-window
}

windowrule {
  name = floating-windows-file-dialogs
  match:class = xdg-desktop-portal-gtk|org.gnome.Nautilus
  match:title = ^(Open.*Files?|Open Folder|Save.*Files?|Save.*As|Save|All Files)

  tag = +floating-window
}

# No transparency on media windows
windowrule {
  name = no-transparency-media-windows
  match:class = zoom|vlc|mpv|org.kde.kdenlive|com.obsproject.Studio|com.github.PintaProject.Pinta|imv|org.gnome.NautilusPreviewer

  opacity = 1 1
}
