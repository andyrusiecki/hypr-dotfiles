# Steam
windowrule {
  name = steam-main-window
  match:class = steam

  opacity = 1 1
  idleinhibit = fullscreen
}

windowrule {
  name = steam-friends-list
  match:class = steam
  match:title = Friends List

  float = on
  size = 400 600
}

windowrule {
  name = steam-games
  match:class = (steam_app_\d+)

  content = game
}

# RetroArch
windowrule {
  name = retroarch
  match:class = retroarch

  content = game
}

# Games
windowrule {
  name = games
  match:content = 3

  opacity = 1 1
  fullscreen = on
  idleinhibit = fullscreen
}

