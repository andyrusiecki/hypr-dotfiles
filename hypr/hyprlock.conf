source = ~/.config/hypr/colors.conf
source = ~/.config/hypr/wallpaper.conf

# background
background {
    monitor =
    color = $background
    path = $wallpaper
    # blur_passes = 2
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# INPUT FIELD
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = $accent_primary
    inner_color = $background
    font_color = $foreground
    fade_on_empty = false
    font_family = $font_family
    placeholder_text = <i><span>Enter Pass</span></i>
    hide_input = false
    position = 0, -225
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%_I:%M %P")</span>"
    color = $foreground
    font_size = 80
    font_family = $font_family
    position = 0, 240
    halign = center
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = $foreground
    font_size = 30
    font_family = $font_family
    position = 0, 105
    halign = center
    valign = center
}

# Profie-Photo
image {
    monitor =
    path = /var/lib/AccountsService/icons/$USER
    border_color = 0xffdddddd
    border_size = 0
    size = 120
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd =
    position = 0, -20
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text = $USER
    color = $foreground
    font_size = 25
    font_family = $font_family
    position = 0, -130
    halign = center
    valign = center
}
