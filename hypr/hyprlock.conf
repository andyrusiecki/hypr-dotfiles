source = ~/.cache/wal/colors-hyprland.conf

background {
    monitor =
    color = $background
    path = ~/.config/hypr/theme/background
    blur_passes = 3
}

animations {
    enabled = true
}

input-field {
    monitor =
    size = 600, 100
    position = 0, 0
    halign = center
    valign = center

    inner_color = $background
    outer_color = $color1
    outline_thickness = 4

    font_family = Hack Nerd Font
    font_color = $foreground

    placeholder_text =   Enter Password 󰈷 
    check_color = $color3
    fail_text = <i>$PAMFAIL ($ATTEMPTS)</i>

    rounding = 0
    shadow_passes = 0
    fade_on_empty = false
}
