# Media

# Laptop multimedia keys for volume and LCD brightness
bindeld = ,XF86AudioRaiseVolume, Volume up, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ && $dotfiles/hypr/scripts/notify-audio-output.sh
bindeld = ,XF86AudioLowerVolume, Volume down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && $dotfiles/hypr/scripts/notify-audio-output.sh
bindeld = ,XF86AudioMute, Mute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && $dotfiles/hypr/scripts/notify-audio-output.sh
bindeld = ,XF86AudioMicMute, Mute microphone, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle && $dotfiles/hypr/scripts/notify-audio-input.sh

bindeld = ,XF86MonBrightnessUp, Brightness up, exec, brightnessctl -c backlight set 5%+
bindeld = ,XF86MonBrightnessDown, Brightness down, exec, brightnessctl -c backlight set 5%-

# Precise 1% multimedia adjustments with Alt modifier
bindeld = ALT, XF86AudioRaiseVolume, Volume up precise, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%+ && $dotfiles/hypr/scripts/notify-audio-output.sh
bindeld = ALT, XF86AudioLowerVolume, Volume down precise, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%- && $dotfiles/hypr/scripts/notify-audio-output.sh

bindeld = ALT, XF86MonBrightnessUp, Brightness up precise, exec, brightnessctl -c backlight set 1%+
bindeld = ALT, XF86MonBrightnessDown, Brightness down precise, exec, brightnessctl -c backlight set 1%-

# Requires playerctl
bindld = , XF86AudioNext, Next track, exec, playerctl next
bindld = , XF86AudioPause, Pause, exec, playerctl play-pause
bindld = , XF86AudioPlay, Play, exec, playerctl play-pause
bindld = , XF86AudioPrev, Previous track, exec, playerctl previous

