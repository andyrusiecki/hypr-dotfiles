{% import "common" as common %}
[global]
frame_color = "{{color4}}"
highlight = "{{color5}}"
separator_color= "{{foreground}}"
font = {{ common.font_family }} 12

[experimental]
per_monitor_dpi = false

[urgency_low]
background = "{{background | darken(0.1)}}ee"
foreground = "{{foreground}}"
frame_color = "{{color4}}"

[urgency_normal]
background = "{{background | darken(0.1)}}80"
foreground = "{{foreground}}"
frame_color = "{{color6}}"

[urgency_critical]
background = "{{background | darken(0.1)}}ee"
foreground = "{{foreground}}"
frame_color = "{{color9}}"
