$font_family = {{font}}

$colorBorderActive = rgba({{colors.primary.default.hex_stripped}}cc)

# color0 is almost the same as the background color,
# by putting ee as the alpha, it makes it 100% transparent
$colorBorderInactive = rgba({{colors.primary_container.default.hex_stripped}}ee)

$foreground = rgb({{colors.on_surface.default.hex_stripped}})
$background = rgb({{colors.surface.default.hex_stripped}})

$accent_primary = rgb({{colors.primary.default.hex_stripped}})
$accent_secondary = rgb({{colors.secondary.default.hex_stripped}})
$accent_tertiary = rgb({{colors.tertiary.default.hex_stripped}})
